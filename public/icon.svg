<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#0d0e0f"/>
  <!-- Battery body -->
  <rect x="116" y="140" width="280" height="300" rx="36" fill="none" stroke="#2d3748" stroke-width="16"/>
  <!-- Battery nub -->
  <rect x="206" y="112" width="100" height="36" rx="12" fill="#2d3748"/>
  <!-- Battery fill (green, ~75%) -->
  <rect x="124" y="215" width="264" height="217" rx="24" fill="#4CAF50" opacity="0.9"/>
  <!-- Shine -->
  <rect x="124" y="215" width="264" height="50" rx="24" fill="url(#shine)" opacity="0.3"/>
  <!-- % text -->
  <text x="256" y="310" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="96" font-weight="800" fill="white" opacity="0.95">%</text>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
